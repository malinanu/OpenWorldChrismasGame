# Build Frostvale and deploy it to a CloudPanel server over SSH.
#
# Pull requests: build + checks (game and game server, server tests against MariaDB). Nothing is deployed.
# Push to `staging` / manual run: build + checks, then
#   - rsync dist/ to the staging site's htdocs (the game), and
#   - rsync server/ next to it and (re)start it with pm2, once the server has been set up there
#     (a .env file in the server folder); until then that step is skipped with a notice.
# (Production will get its own job/environment later.)
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDPANEL_HOST         Server hostname or IP
#   CLOUDPANEL_USER         The CloudPanel *site user* that owns the site (not root)
#   CLOUDPANEL_SSH_KEY      Private key whose public half is in that user's ~/.ssh/authorized_keys
#   CLOUDPANEL_PATH         Site root, e.g. /home/frostvale/htdocs/frostvale.example.com
#   CLOUDPANEL_KNOWN_HOSTS  Output of `ssh-keyscan -p <port> <host>` (pins the server's host key)
#   CLOUDPANEL_PORT         Optional, defaults to 22
#   CLOUDPANEL_SERVER_PATH  Optional, where the game server lives; defaults to /home/<site-user>/frostvale-server
# Optional repository variable:
#   SITE_URL                Public URL, shown on the run page and smoke-tested after deploy
# See deploy/CLOUDPANEL.md for the one-time server setup.

name: Deploy to CloudPanel (staging)

on:
  push:
    branches: [staging]
  pull_request:
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the running one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build & check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Same database CloudPanel ships, for the server's integration tests.
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: frostvale_test
          MARIADB_USER: frostvale
          MARIADB_PASSWORD: frostpw
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove every Santa's Express level is solvable
        run: npm run check-levels

      - name: Type-check and build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

      - name: Game server — install, type-check, build
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Game server — tests (MariaDB)
        working-directory: server
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_USER: frostvale
          TEST_DB_PASSWORD: frostpw
          TEST_DB_NAME: frostvale_test
        run: npm test

      - name: Upload game server
        uses: actions/upload-artifact@v4
        with:
          name: server
          path: |
            server/dist
            server/migrations
            server/package.json
            server/package-lock.json
            server/ecosystem.config.cjs
            server/.env.example
          retention-days: 7

  deploy:
    name: Deploy to CloudPanel staging
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/staging' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: CLOUDPANEL_STAGING
      url: ${{ vars.SITE_URL }}
    env:
      HOST: ${{ secrets.CLOUDPANEL_HOST }}
      SSH_USER: ${{ secrets.CLOUDPANEL_USER }}
      PORT: ${{ secrets.CLOUDPANEL_PORT || '22' }}
      TARGET: ${{ secrets.CLOUDPANEL_PATH }}
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Download game server
        uses: actions/download-artifact@v4
        with:
          name: server
          path: server

      - name: Check secrets
        run: |
          missing=0
          for v in HOST SSH_USER TARGET; do
            if [ -z "${!v}" ]; then echo "::error::Secret for $v is not set"; missing=1; fi
          done
          case "$TARGET" in
            /home/*/htdocs/*) ;;
            *) echo "::error::CLOUDPANEL_PATH must look like /home/<site-user>/htdocs/<domain>"; missing=1 ;;
          esac
          exit $missing

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.CLOUDPANEL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CLOUDPANEL_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::CLOUDPANEL_KNOWN_HOSTS is not set; trusting the host key seen now. Set it to pin the key."
            ssh-keyscan -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Upload with rsync
        run: |
          # --delay-updates swaps all new files in at the end; --delete-after then removes stale ones,
          # so players never load half an old build and half a new one.
          # -rlt (not -a): copy files, symlinks and file times only. The site root belongs to CloudPanel, so the
          # site user may not change its permissions or mtime; files keep the server's default (nginx-readable) modes.
          rsync -rltz --omit-dir-times --delete-after --delay-updates --human-readable --stats \
            --exclude='.well-known/' --exclude='.user.ini' \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes" \
            dist/ "$SSH_USER@$HOST:$TARGET/"

      - name: Upload and restart the game server
        env:
          SERVER_PATH: ${{ secrets.CLOUDPANEL_SERVER_PATH }}
        run: |
          DIR="${SERVER_PATH:-/home/$SSH_USER/frostvale-server}"
          SSH="ssh -i $HOME/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes"
          $SSH "$SSH_USER@$HOST" "mkdir -p '$DIR'"
          # .env (secrets) and node_modules live only on the server and are never overwritten.
          rsync -rltz --omit-dir-times --delete-after --delay-updates --human-readable \
            --exclude='.env' --exclude='node_modules/' -e "$SSH" server/ "$SSH_USER@$HOST:$DIR/"
          $SSH "$SSH_USER@$HOST" DIR="$DIR" bash -s <<'REMOTE'
          set -e
          cd "$DIR"
          # Node from nvm (CloudPanel's Node.js setup) if it isn't already on PATH.
          [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh" >/dev/null
          if [ ! -f .env ]; then
            echo "::notice::Game server uploaded but not started: no $DIR/.env yet. See deploy/CLOUDPANEL.md (section 5)."
            exit 0
          fi
          if ! command -v node >/dev/null; then
            echo "::warning::Node.js is not installed for $(whoami); the game server was not started. See deploy/CLOUDPANEL.md."
            exit 0
          fi
          npm ci --omit=dev --no-audit --no-fund
          PM2="pm2"; command -v pm2 >/dev/null || PM2="npx --yes pm2@7"
          $PM2 startOrReload ecosystem.config.cjs --update-env
          $PM2 save
          echo "Game server running: $($PM2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s).find(p=>p.name==="frostvale-server");console.log(a?a.pm2_env.status:"not found")})')"
          REMOTE

      - name: Smoke test
        if: vars.SITE_URL != ''
        run: |
          url="${{ vars.SITE_URL }}"
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$url")
          echo "GET $url -> $code"
          test "$code" = 200
          curl -sf --retry 3 "${url%/}/world/frostvale.json" > /dev/null
          echo "World data reachable ✅"
          if curl -sf --retry 3 --retry-delay 3 "${url%/}/api/health" > /dev/null; then
            echo "Game server reachable ✅"
          else
            echo "::warning::${url%/}/api/health isn't answering yet — accounts and multiplayer stay offline until the server setup in deploy/CLOUDPANEL.md is done."
          fi

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
