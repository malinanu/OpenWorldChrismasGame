server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name openworldchrismasgame.3logiq.com;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  include /etc/nginx/global_settings;

  index index.html;

  # Frostvale: nginx serves the game files from htdocs (fast, and the game still loads,
  # offline-only, if the Node server is down). Anything that isn't a file — /api/* and the
  # /ws multiplayer socket — goes to the Node server.

  # The page and the service worker: always check for a new deploy.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ @app;
  }

  # Fingerprinted build files never change: cache for a year.
  location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css|wasm|wasm\.bin)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri @app;
  }

  # Models, textures, world data: cache for a day.
  location ~* \.(gltf|glb|bin|webp|png|jpg|json)$ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri @app;
  }

  location @app {
    proxy_pass http://127.0.0.1:{{app_port}};
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_pass_request_headers on;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 900;
    proxy_send_timeout 900;
    # Multiplayer sockets stay open for a whole play session.
    proxy_read_timeout 3600;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;
  }
}
